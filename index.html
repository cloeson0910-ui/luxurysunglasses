<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Try-On — Occhiali 3D</title>
<style>
  :root {
    --bronze: #1a1512;
    --gold: #c79c43;
    --cream: #f6f2ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bronze);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 {
    font-weight: 300;
    letter-spacing: 3px;
    font-size: 22px;
    text-transform: uppercase;
    color: var(--gold);
  }
  header p { font-size: 13px; opacity: 0.6; margin-top: 6px; }

  #stage {
    position: relative;
    width: min(640px, 92vw);
    aspect-ratio: 4 / 3; /* valore iniziale, corretto via JS con l'aspect ratio reale della fotocamera */
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(199,156,67,0.35);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #mirror-wrap {
    position: absolute;
    inset: 0;
    transform: scaleX(-1); /* effetto specchio, video + 3D insieme */
  }
  video, canvas#gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  video { z-index: 1; }
  canvas#gl { z-index: 2; pointer-events: none; }

  #status {
    position: absolute;
    top: 10px; left: 10px;
    z-index: 5;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(0,0,0,0.55);
    letter-spacing: 0.5px;
  }
  #status.ok { color: #7be08a; }
  #status.wait { color: #e0c37b; }
  #status.err { color: #e07b7b; }

  #start-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,8,6,0.92);
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  #start-overlay button {
    background: linear-gradient(135deg, #8f6f2c, #c79c43, #f1d27a, #a77d31);
    color: #1a1512;
    border: none;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    border-radius: 30px;
    cursor: pointer;
    text-transform: uppercase;
  }
  #start-overlay small { opacity: 0.55; max-width: 380px; font-size: 12px; line-height: 1.5; }

  #controls {
    width: min(640px, 92vw);
    margin-top: 18px;
  }
  #glasses-picker {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .g-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(199,156,67,0.3);
    color: var(--cream);
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .g-btn:hover { border-color: var(--gold); }
  .g-btn.active {
    background: rgba(199,156,67,0.18);
    border-color: var(--gold);
    color: var(--gold);
  }

  details {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(199,156,67,0.15);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
  }
  summary { cursor: pointer; color: var(--gold); letter-spacing: 0.5px; }
  .sliders { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-row label { display: flex; justify-content: space-between; opacity: 0.7; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
</style>
</head>
<body>

<header>
  <h1>Virtual Try-On</h1>
  <p>Prova le montature 3D in tempo reale</p>
</header>

<div id="stage">
  <div id="start-overlay">
    <button id="start-btn">Attiva fotocamera</button>
    <small>Il video resta nel tuo browser: nessun frame viene inviato altrove. Serve per posizionare l'occhiale 3D sul volto in tempo reale.</small>
  </div>
  <div id="status" class="wait" style="display:none;">Inizializzazione…</div>
  <div id="mirror-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="gl"></canvas>
  </div>
</div>

<div id="controls">
  <div id="glasses-picker">
    <button class="g-btn active" data-model="sunglasses">Sunglasses</button>
    <button class="g-btn" data-model="classic">Classic</button>
    <button class="g-btn" data-model="glass">Glass</button>
    <button class="g-btn" data-model="sun-12983">Sun 12983</button>
  </div>

  <details>
    <summary>Calibrazione manuale (regolazioni fini, opzionale)</summary>
    <div class="sliders">
      <div class="slider-row">
        <label><span>Scala</span><span id="v-scale">1.00</span></label>
        <input type="range" id="s-scale" min="0.65" max="1.45" step="0.01" value="1">
      </div>
      <div class="slider-row">
        <label><span>Alto / Basso (cm)</span><span id="v-y">0.0</span></label>
        <input type="range" id="s-y" min="-4" max="4" step="0.1" value="0">
      </div>
      <div class="slider-row">
        <label><span>Avanti / Indietro (cm)</span><span id="v-z">0.0</span></label>
        <input type="range" id="s-z" min="-6" max="6" step="0.1" value="0">
      </div>
      <div class="slider-row">
        <label><span>Sinistra / Destra (cm)</span><span id="v-x">0.0</span></label>
        <input type="range" id="s-x" min="-4" max="4" step="0.1" value="0">
      </div>
    </div>
  </details>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const statusEl = document.getElementById('status');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const video = document.getElementById('video');
const glCanvas = document.getElementById('gl');
const stage = document.getElementById('stage');

function setStatus(text, cls='wait') {
  statusEl.style.display = 'block';
  statusEl.textContent = text;
  statusEl.className = cls;
}

// ---------- Three.js: overlay 3D in coordinate schermo ----------
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true, premultipliedAlpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.1));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-1, 1.5, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffe6b0, 1.3);
fill.position.set(2, 0, 2);
scene.add(fill);

let camera = new THREE.OrthographicCamera(-320, 320, 240, -240, 0.1, 2000);
camera.position.set(0, 0, 600);
camera.lookAt(0,0,0);

const faceAnchor = new THREE.Group();
faceAnchor.visible = false;
scene.add(faceAnchor);

const calibGroup = new THREE.Group();
faceAnchor.add(calibGroup);

const glassesModels = {};
let currentModelName = 'sunglasses';
let currentGlasses = null;
const loader = new GLTFLoader();

const MODEL_FILES = {
  "sunglasses": { url: "models/Sunglasses.glb", rx: 0, ry: 0, rz: 0, widthFactor: 1.78, yFactor: 0.04 },
  "classic":    { url: "models/10320_Sunglasses.glb", rx: Math.PI / 2, ry: 0, rz: 0, widthFactor: 1.78, yFactor: 0.04 },
  "glass":      { url: "models/glass.glb", rx: 0, ry: 0, rz: 0, widthFactor: 1.78, yFactor: 0.04 },
  "sun-12983":  { url: "models/12983_Sunglasses.glb", rx: Math.PI / 2, ry: 0, rz: 0, widthFactor: 1.78, yFactor: 0.04 }
};

function prepareModel(group, cfg) {
  group.rotation.set(cfg.rx || 0, cfg.ry || 0, cfg.rz || 0);
  group.updateMatrixWorld(true);

  let box = new THREE.Box3().setFromObject(group);
  let size = new THREE.Vector3();
  let center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  group.position.sub(center);
  group.updateMatrixWorld(true);

  // Dopo la rotazione, normalizziamo la larghezza X a 1 unità.
  box = new THREE.Box3().setFromObject(group);
  box.getSize(size);
  const width = Math.max(size.x, 0.000001);
  group.scale.multiplyScalar(1 / width);

  group.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.filter(Boolean).forEach(m => {
      m.side = THREE.DoubleSide;
      if ('transparent' in m && m.opacity < 0.08) m.opacity = 0.35;
      m.needsUpdate = true;
    });
  });
}

function loadGlassesModels() {
  let completed = 0;
  const entries = Object.entries(MODEL_FILES);
  entries.forEach(([name, cfg]) => {
    loader.load(cfg.url, gltf => {
      const group = gltf.scene;
      prepareModel(group, cfg);
      group.visible = false;
      glassesModels[name] = group;
      calibGroup.add(group);
      completed++;
      if (name === currentModelName) showModel(name);
      if (completed === entries.length) setStatus('Modelli 3D pronti · inquadra il volto', 'ok');
    }, undefined, err => {
      console.error('Errore modello', name, err);
      completed++;
      setStatus('Errore caricamento modello: ' + name, 'err');
    });
  });
}

function showModel(name) {
  Object.values(glassesModels).forEach(g => g.visible = false);
  currentModelName = name;
  if (glassesModels[name]) {
    currentGlasses = glassesModels[name];
    currentGlasses.visible = true;
  }
}

// ---------- Calibrazione ----------
const sScale = document.getElementById('s-scale');
const sX = document.getElementById('s-x');
const sY = document.getElementById('s-y');
const sZ = document.getElementById('s-z');
const vScale = document.getElementById('v-scale');
const vX = document.getElementById('v-x');
const vY = document.getElementById('v-y');
const vZ = document.getElementById('v-z');

// Safari può ripristinare valori precedenti degli input range dopo refresh: forziamo il reset.
sScale.value = '1'; sX.value = '0'; sY.value = '0'; sZ.value = '0';

function updateLabels() {
  vScale.textContent = Number(sScale.value).toFixed(2);
  vX.textContent = Number(sX.value).toFixed(1);
  vY.textContent = Number(sY.value).toFixed(1);
  vZ.textContent = Number(sZ.value).toFixed(1);
}
[sScale,sX,sY,sZ].forEach(el => el.addEventListener('input', updateLabels));
updateLabels();

document.querySelectorAll('.g-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.g-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showModel(btn.dataset.model);
  });
});

// ---------- MediaPipe ----------
let faceLandmarker = null;
let running = false;
let lastVideoTime = -1;
let lostFrames = 0;
let smooth = { x:0, y:0, w:150, roll:0, init:false };

async function initFaceLandmarker() {
  setStatus('Carico il rilevamento volto…', 'wait');
  const resolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(resolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: false,
    outputFacialTransformationMatrixes: false,
    runningMode: "VIDEO",
    numFaces: 1
  });
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width:{ideal:1280}, height:{ideal:720}, facingMode:'user' },
    audio:false
  });
  video.srcObject = stream;
  await new Promise(resolve => video.onloadedmetadata = resolve);
  await video.play();
  if (video.videoWidth && video.videoHeight) {
    stage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  }
}

function resizeRenderer() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.left = -r.width/2;
  camera.right = r.width/2;
  camera.top = r.height/2;
  camera.bottom = -r.height/2;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);

function lerpAngle(a,b,t) {
  let d = b-a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}

function updateGlassesFromLandmarks(lm) {
  const r = stage.getBoundingClientRect();
  const W = r.width, H = r.height;

  // MediaPipe Face Mesh: 33 e 263 sono gli angoli esterni degli occhi.
  const left = lm[33];
  const right = lm[263];
  if (!left || !right) return false;

  const dx = (right.x-left.x) * W;
  const dy = (right.y-left.y) * H;
  const eyeDist = Math.hypot(dx,dy);
  if (!Number.isFinite(eyeDist) || eyeDist < 18) return false;

  const midX = ((left.x+right.x)*0.5 - 0.5) * W;
  const midY = (0.5 - (left.y+right.y)*0.5) * H;
  const roll = -Math.atan2(dy, dx);
  const cfg = MODEL_FILES[currentModelName] || MODEL_FILES.sunglasses;
  const targetW = eyeDist * cfg.widthFactor;

  const a = smooth.init ? 0.32 : 1;
  smooth.x += (midX-smooth.x)*a;
  smooth.y += (midY-smooth.y)*a;
  smooth.w += (targetW-smooth.w)*a;
  smooth.roll = lerpAngle(smooth.roll, roll, a);
  smooth.init = true;

  // Slider: offset espresso visivamente in "cm" ma convertito in pixel in modo proporzionale.
  const unitPx = eyeDist * 0.055;
  faceAnchor.position.set(
    smooth.x + Number(sX.value)*unitPx,
    smooth.y + Number(sY.value)*unitPx + eyeDist*cfg.yFactor,
    Number(sZ.value)*0.5
  );
  const sc = smooth.w * Number(sScale.value);
  faceAnchor.scale.set(sc,sc,sc);
  faceAnchor.rotation.set(0,0,smooth.roll);
  faceAnchor.visible = !!currentGlasses;
  return true;
}

function renderLoop() {
  if (!running) return;
  requestAnimationFrame(renderLoop);
  if (video.readyState < 2 || !faceLandmarker) {
    renderer.render(scene,camera);
    return;
  }

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = faceLandmarker.detectForVideo(video, performance.now());
    const lm = result.faceLandmarks?.[0];
    if (lm && updateGlassesFromLandmarks(lm)) {
      lostFrames = 0;
      setStatus(currentGlasses ? 'Volto rilevato · occhiali attivi' : 'Volto rilevato · carico occhiali…', currentGlasses ? 'ok' : 'wait');
    } else {
      lostFrames++;
      if (lostFrames > 7) {
        faceAnchor.visible = false;
        smooth.init = false;
        setStatus('Nessun volto rilevato — inquadra il viso', 'wait');
      }
    }
  }
  renderer.render(scene,camera);
}

startBtn.addEventListener('click', async () => {
  try {
    startBtn.disabled = true;
    setStatus('Richiesta accesso fotocamera…','wait');
    await startCamera();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    resizeRenderer();
    await initFaceLandmarker();
    loadGlassesModels();
    startOverlay.style.display = 'none';
    running = true;
    renderLoop();
  } catch(err) {
    console.error(err);
    startBtn.disabled = false;
    setStatus('Errore: '+(err.message || err),'err');
  }
});
</script>
</body>
</html>
